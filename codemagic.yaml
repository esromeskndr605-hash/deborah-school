
workflows:
  android-apk:
    name: Deborah School APK
    environment:
      flutter: stable
    scripts:
      - name: Generate Android directory
        script: |
          flutter create . --platforms=android
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
